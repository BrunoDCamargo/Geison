name: Issue 12 logging events fix

on:
  push:
    branches:
      - feature/issue-12-reproducibility-diagnostics
    paths:
      - .github/workflows/issue12-log-events-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-12-reproducibility-diagnostics

      - name: Add required diagnostic lifecycle events
        shell: python
        run: |
          from pathlib import Path

          path = Path("qpcr_pipeline/run_recording.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '    "run_started": frozenset({"target_name", "status"}),\n    "stage_started":':
                  '    "run_started": frozenset({"target_name", "status"}),\n    "environment_inspected": frozenset(),\n    "plan_created": frozenset(),\n    "stage_started":',
              '        self._logger.emit("run_started", target_name=target_name, status="RUNNING")\n        return attempt_id':
                  '        self._logger.emit("run_started", target_name=target_name, status="RUNNING")\n        self._logger.emit("environment_inspected")\n        self._logger.emit("plan_created")\n        return attempt_id',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence, got {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Verify focused test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest tests/test_run_recording.py::test_begin_attempt_logs_environment_and_plan_creation -q
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qpcr_pipeline/run_recording.py
          git commit -m "fix: emit environment and plan lifecycle events"
          git push origin HEAD:${GITHUB_REF_NAME}
