name: Report branch validation

on:
  push:
    branches: [feat/researcher-evidence-report]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: report-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact source snapshot
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/commit.txt
          git archive --format=zip HEAD -o validation/source.zip
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Full offline regression suite
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=validation/unit.xml 2>&1 | tee validation/unit.log
      - name: Install integration dependencies
        if: always()
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cd-hit mafft primer3
      - name: Integration suite
        if: always()
        run: |
          set -o pipefail
          python -m unittest discover -s integration_tests -q 2>&1 | tee validation/integration.log
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validation-${{ github.sha }}
          path: validation/
          retention-days: 3
