version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

      - run:
          name: Run normal test suite
          command: python -m pytest -q

      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Install integration tools
                command: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    cd-hit \
                    mafft \
                    primer3

            - run:
                name: Verify integration tools
                command: |
                  command -v cd-hit-est
                  command -v mafft
                  command -v primer3_core

            - run:
                name: Run integration test suite
                command: python -m unittest discover -s integration_tests -q

  issue13_real_doctor:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install project and real tools
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e .
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              cd-hit \
              mafft \
              primer3
      - run:
          name: Verify real doctor environment
          command: |
            command -v cd-hit-est
            command -v mafft
            command -v primer3_core
            set +e
            cd-hit-est -h >/tmp/cdhit.txt 2>&1
            cdhit_rc=$?
            primer3_core --about >/tmp/primer3.txt 2>&1
            primer3_rc=$?
            set -e
            echo "cd-hit-est -h RC=${cdhit_rc}"
            echo "primer3_core --about RC=${primer3_rc}"
            cat /tmp/primer3.txt
            python -c 'from qpcr_pipeline.diagnostics import EnvironmentInspector, render_environment_report; report = EnvironmentInspector().inspect(None); print(render_environment_report(report)); assert report.git.installed; assert all(report.tools[name].installed and report.tools[name].version for name in ("cd-hit-est", "mafft", "primer3_core"))'

  issue13_unit:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install project and pytest
          command: python -m pip install -e . pytest
      - run:
          name: Run full test suite
          command: python -m pytest -q

  issue13_integration:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install project and real tools
          command: |
            python -m pip install -e .
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              cd-hit \
              mafft \
              primer3
      - run:
          name: Run integration test suite
          command: python -m unittest discover -s integration_tests -q

  issue13_diff:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check diff whitespace
          command: |
            git fetch --no-tags --depth=1 origin develop
            git diff --check FETCH_HEAD..HEAD

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main"
      - issue13_real_doctor:
          filters: pipeline.git.branch == "fix/issue-13-colab-doctor"
      - issue13_unit:
          filters: pipeline.git.branch == "fix/issue-13-colab-doctor"
      - issue13_integration:
          filters: pipeline.git.branch == "fix/issue-13-colab-doctor"
      - issue13_diff:
          filters: pipeline.git.branch == "fix/issue-13-colab-doctor"
