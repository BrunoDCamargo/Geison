version: 2.1

jobs:
  issue13_report_red:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install test runner
          command: python -m pip install pytest
      - run:
          name: Run Colab notebook contract
          command: python -m pytest -q tests/test_colab_notebook.py

workflows:
  ci:
    jobs:
      - issue13_report_red:
          filters: pipeline.git.branch == "fix/issue-13-colab-report"
