version: 2.1
jobs:
  guided_demo_red:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: RED deterministic guided demo
          command: python -m pytest -q tests/test_guided_demo.py
workflows:
  ci:
    jobs:
      - guided_demo_red:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
