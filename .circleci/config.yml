version: 2.1

jobs:
  issue12_push_probe:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify feature branch push access
          command: git push --dry-run origin HEAD:${CIRCLE_BRANCH}

workflows:
  ci:
    jobs:
      - issue12_push_probe:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
