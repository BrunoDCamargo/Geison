version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  checkpoint_codecs:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_checkpoint_codecs.py

  checkpoint_stages:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_checkpoint_stages.py

  checkpointing:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_checkpointing.py

  pipeline_panel:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_panel.py

  pipeline_ranking:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_ranking.py

  pipeline_resume:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_resume.py

  pipeline_specificity:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_specificity.py

workflows:
  ci:
    jobs:
      - checkpoint_codecs:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - checkpoint_stages:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - checkpointing:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - pipeline_panel:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - pipeline_ranking:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - pipeline_resume:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - pipeline_specificity:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
