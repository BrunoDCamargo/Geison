version: 2.1

jobs:
  mafft_direction_red:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: Run MAFFT direction regression
          command: python -m pytest -q tests/test_mafft_direction_mode.py

workflows:
  ci:
    jobs:
      - mafft_direction_red:
          filters: pipeline.git.branch == "fix/mafft-fast-direction"
