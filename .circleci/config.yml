version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

      - run:
          name: Run focused issue 9 tests
          command: |
            python -m pytest -q \
              tests/test_specificity_config.py \
              tests/test_specificity_matching.py

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "feature/issue-9-specificity"
