version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  resume_geison_version:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_resume.py::test_geison_version_change_invalidates_entire_chain

  resume_mafft_version:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_resume.py::test_mafft_version_change_invalidates_alignment_and_descendants_only

  resume_online_input:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          command: python -m pytest -q tests/test_pipeline_resume.py::test_forced_online_input_refresh_changes_result_fingerprint_and_forces_downstream

workflows:
  ci:
    jobs:
      - resume_geison_version:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - resume_mafft_version:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - resume_online_input:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
