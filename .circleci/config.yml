version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run normal test suite
          command: python -m pytest -q
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Install integration tools
                command: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    cd-hit \
                    mafft \
                    primer3
            - run:
                name: Verify integration tools
                command: |
                  command -v cd-hit-est
                  command -v mafft
                  command -v primer3_core
            - run:
                name: Run integration test suite
                command: python -m unittest discover -s integration_tests -q

  issue12_minimal:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run minimal pipeline tests
          command: python -m pytest tests/test_minimal_run.py -q

  issue12_pipeline_ranking:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run pipeline ranking tests
          command: python -m pytest tests/test_pipeline_ranking.py -q

  issue12_pipeline_resume:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run pipeline resume tests
          command: python -m pytest tests/test_pipeline_resume.py -q

  issue12_pipeline_specificity:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run pipeline specificity tests
          command: python -m pytest tests/test_pipeline_specificity.py -q

  issue12_primer:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run primer tests
          command: python -m pytest tests/test_primer3.py tests/test_primer_design.py -q

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main"
      - issue12_minimal:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
      - issue12_pipeline_ranking:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
      - issue12_pipeline_resume:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
      - issue12_pipeline_specificity:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
      - issue12_primer:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
