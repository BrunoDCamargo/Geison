version: 2.1

jobs:
  legacy_af:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: Run legacy tests A-F
          command: |
            FILES=$(find tests -maxdepth 1 -type f -name 'test_[a-f]*.py' | grep -Ev 'test_(challenge_panel|contrastive_|execution|guided_|primer_contrastive_source|region_selection)\.py$' | sort | tr '\n' ' ')
            echo "$FILES"
            test -n "$FILES"
            python -m pytest -q $FILES

