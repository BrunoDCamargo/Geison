version: 2.1

jobs:
  issue12_attempt_history_red:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: Run per-attempt audit history test
          command: python -m pytest tests/test_run_recording.py::test_attempt_history_preserves_execution_policy_and_plan -q

workflows:
  ci:
    jobs:
      - issue12_attempt_history_red:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
