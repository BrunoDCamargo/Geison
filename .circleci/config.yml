version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: Run IUPAC semantic regression
          command: python -m pytest -q tests/test_pipeline_specificity.py -k semantic

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "feature/issue-9-specificity"
