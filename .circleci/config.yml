version: 2.1

jobs:
  pipeline_resume:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: Verify pipeline resume regression
          command: python -m pytest -q tests/test_pipeline_resume.py

workflows:
  ci:
    jobs:
      - pipeline_resume:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
