version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run normal test suite
          command: python -m pytest -q
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Install integration tools
                command: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    cd-hit \
                    mafft \
                    primer3
            - run:
                name: Verify integration tools
                command: |
                  command -v cd-hit-est
                  command -v mafft
                  command -v primer3_core
            - run:
                name: Run integration test suite
                command: python -m unittest discover -s integration_tests -q

  issue12_dry_run:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run dry-run binary probe guard
          command: python -m pytest tests/test_dry_run.py::test_resume_dry_run_reuses_environment_tool_identity_without_probing_binaries -q

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main"
      - issue12_dry_run:
          filters: pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
