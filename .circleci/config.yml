version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

      - run:
          name: Run test suite
          command: |
            if [ "$CIRCLE_BRANCH" = "feature/issue-12-reproducibility-diagnostics" ]; then
              python -m pytest tests/test_run_lifecycle.py -q
            else
              python -m pytest -q
            fi

      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Install integration tools
                command: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    cd-hit \
                    mafft \
                    primer3

            - run:
                name: Verify integration tools
                command: |
                  command -v cd-hit-est
                  command -v mafft
                  command -v primer3_core

            - run:
                name: Run integration test suite
                command: python -m unittest discover -s integration_tests -q

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main" or pipeline.git.branch == "feature/issue-12-reproducibility-diagnostics"
