version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

      - run:
          name: Smoke installed CLI import and parser
          command: qpcr-pipeline panel approve --help

workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main" or pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
