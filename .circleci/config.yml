version: 2.1

executors:
  python:
    docker:
      - image: cimg/python:3.12
    resource_class: small

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  unit_regression:
    executor: python
    steps:
      - install_project
      - run:
          name: Run full pytest suite
          command: python -m pytest -q

  cli_smoke:
    executor: python
    steps:
      - install_project
      - run:
          name: Smoke installed CLI
          command: |
            qpcr-pipeline doctor
            qpcr-pipeline panel approve --help
            qpcr-pipeline panel approve tests/fixtures/panels/west_nile_proposal.yaml --output approved-panel-smoke.json
            python -c "import json; p=json.load(open('approved-panel-smoke.json', encoding='utf-8')); assert p['status']=='APPROVED'; assert p['approved_by_user'] is True; assert p['proposal_sha256'].startswith('sha256:')"
            rm approved-panel-smoke.json

  integration:
    executor: python
    steps:
      - install_project
      - run:
          name: Install integration tools
          command: |
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cd-hit mafft primer3
            command -v cd-hit-est
            command -v mafft
            command -v primer3_core
      - run:
          name: Run full integration suite
          command: python -m unittest discover -s integration_tests -q

workflows:
  ci:
    jobs:
      - unit_regression:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - cli_smoke:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - integration:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
