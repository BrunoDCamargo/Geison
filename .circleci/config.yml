version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  legacy_checkpoint:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run checkpoint tests
          command: python -m pytest -q $(find tests -maxdepth 1 -type f -name 'test_checkpoint*.py' | sort)

  legacy_cli_colab:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run CLI and low-level Colab tests
          command: |
            FILES=$(find tests -maxdepth 1 -type f \( -name 'test_cli*.py' -o -name 'test_colab*.py' \) | sort | tr '\n' ' ')
            echo "$FILES"
            python -m pytest -q $FILES

  legacy_config:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run configuration tests
          command: python -m pytest -q $(find tests -maxdepth 1 -type f -name 'test_config*.py' | sort)

  legacy_cluster_conservation:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run clustering and conservation tests
          command: |
            FILES=$(find tests -maxdepth 1 -type f \( -name 'test_clustering*.py' -o -name 'test_conservation*.py' \) | sort | tr '\n' ' ')
            echo "$FILES"
            python -m pytest -q $FILES

workflows:
  ci:
    jobs:
      - legacy_checkpoint:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_cli_colab:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_config:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_cluster_conservation:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
