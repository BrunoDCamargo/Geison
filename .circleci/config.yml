version: 2.1

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  legacy_panel:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run panel tests
          command: python -m pytest -q $(find tests -maxdepth 1 -type f -name 'test_panel*.py' | sort)

  legacy_pipeline:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run pipeline tests
          command: python -m pytest -q $(find tests -maxdepth 1 -type f -name 'test_pipeline*.py' | sort)

  legacy_planning_provenance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run planning and provenance tests
          command: |
            FILES=$(find tests -maxdepth 1 -type f \( -name 'test_planning*.py' -o -name 'test_provenance*.py' \) | sort | tr '\n' ' ')
            echo "$FILES"
            if [ -n "$FILES" ]; then python -m pytest -q $FILES; fi

  legacy_primer:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run primer tests
          command: |
            FILES=$(find tests -maxdepth 1 -type f -name 'test_primer*.py' | grep -Ev 'test_primer_contrastive_source\.py$' | sort | tr '\n' ' ')
            echo "$FILES"
            python -m pytest -q $FILES

  legacy_qc:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - install_project
      - run:
          name: Run QC tests
          command: python -m pytest -q $(find tests -maxdepth 1 -type f -name 'test_q*.py' | sort)

workflows:
  ci:
    jobs:
      - legacy_panel:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_pipeline:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_planning_provenance:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_primer:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_qc:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
