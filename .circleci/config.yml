version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest
      - run:
          name: RED contrastive checkpoint integration
          command: |
            python -m pytest -q \
              tests/test_contrastive_checkpoint_contract.py \
              tests/test_contrastive_checkpoint_integration.py
workflows:
  ci:
    jobs:
      - test:
          filters: pipeline.git.branch == "develop" or pipeline.git.branch == "main" or pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
