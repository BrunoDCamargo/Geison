version: 2.1

jobs:
  mafft_diff_check:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check diff whitespace
          command: |
            git fetch origin develop
            git diff --check origin/develop...HEAD

workflows:
  ci:
    jobs:
      - mafft_diff_check:
          filters: pipeline.git.branch == "fix/mafft-fast-direction"
