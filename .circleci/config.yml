version: 2.1

executors:
  python:
    docker:
      - image: cimg/python:3.12
    resource_class: small

commands:
  install_project:
    steps:
      - checkout
      - run:
          name: Install Python project and test runner
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e . pytest

jobs:
  feature_core:
    executor: python
    steps:
      - install_project
      - run:
          name: Run contrastive scientific unit tests
          command: |
            python -m pytest -q \
              tests/test_challenge_panel.py \
              tests/test_contrastive_similarity.py \
              tests/test_contrastive_conservation.py \
              tests/test_contrastive_report_html.py \
              tests/test_contrastive_stage_contract.py \
              tests/test_primer_contrastive_source.py \
              tests/test_region_selection.py

  feature_checkpoint_guided:
    executor: python
    steps:
      - install_project
      - run:
          name: Run checkpoint and guided workflow unit tests
          command: |
            python -m pytest -q \
              tests/test_contrastive_checkpoint_contract.py \
              tests/test_contrastive_checkpoint_integration.py \
              tests/test_execution.py \
              tests/test_guided_demo.py \
              tests/test_guided_colab_notebook.py

  legacy_regression:
    executor: python
    steps:
      - install_project
      - run:
          name: Run legacy regression tests
          command: |
            python -m pytest -q tests \
              --ignore=tests/test_challenge_panel.py \
              --ignore=tests/test_contrastive_similarity.py \
              --ignore=tests/test_contrastive_conservation.py \
              --ignore=tests/test_contrastive_report_html.py \
              --ignore=tests/test_contrastive_stage_contract.py \
              --ignore=tests/test_primer_contrastive_source.py \
              --ignore=tests/test_region_selection.py \
              --ignore=tests/test_contrastive_checkpoint_contract.py \
              --ignore=tests/test_contrastive_checkpoint_integration.py \
              --ignore=tests/test_execution.py \
              --ignore=tests/test_guided_demo.py \
              --ignore=tests/test_guided_colab_notebook.py

workflows:
  ci:
    jobs:
      - feature_core:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - feature_checkpoint_guided:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
      - legacy_regression:
          filters: pipeline.git.branch == "feat/contrastive-conservation-guided-colab"
